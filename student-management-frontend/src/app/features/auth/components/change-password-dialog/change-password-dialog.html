<div class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-header">
      <h3>🔑 Change Admin Password</h3>
      <button class="btn-close" (click)="cancel()">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input
          type="password"
          id="currentPassword"
          name="currentPassword"
          [(ngModel)]="passwordData.currentPassword"
          required
          placeholder="Enter current password"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="newPassword">New Password (min 8 chars)</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          [(ngModel)]="passwordData.newPassword"
          required
          placeholder="Enter new password"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmNewPassword"
          name="confirmNewPassword"
          [(ngModel)]="passwordData.confirmNewPassword"
          required
          placeholder="Re-enter new password"
          class="form-control"
        />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="loading">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Saving...' : 'Update Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
