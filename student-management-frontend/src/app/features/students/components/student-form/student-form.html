<div class="form-container">
  <div class="back-link">
    <a routerLink="/students">← Back to Students List</a>
  </div>

  <div class="form-card">
    <h2>{{ isEditMode ? 'Edit Student' : 'Add New Student' }}</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input id="firstName" formControlName="firstName" type="text" class="form-control" />
          <div class="error" *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">
            First name is required.
          </div>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input id="lastName" formControlName="lastName" type="text" class="form-control" />
          <div class="error" *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">
            Last name is required.
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email *</label>
          <input id="email" formControlName="email" type="email" class="form-control" />
          <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Valid email is required.
          </div>
        </div>
        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input id="phoneNumber" formControlName="phoneNumber" type="text" class="form-control" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="enrollmentNumber">Enrollment Number *</label>
          <input id="enrollmentNumber" formControlName="enrollmentNumber" type="text" class="form-control" />
          <div class="error" *ngIf="form.get('enrollmentNumber')?.touched && form.get('enrollmentNumber')?.invalid">
            Enrollment number is required.
          </div>
        </div>
        <div class="form-group">
          <label for="department">Department *</label>
          <input id="department" formControlName="department" type="text" class="form-control" placeholder="Computer Science" />
          <div class="error" *ngIf="form.get('department')?.touched && form.get('department')?.invalid">
            Department is required.
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dateOfBirth">Date of Birth</label>
          <input id="dateOfBirth" formControlName="dateOfBirth" type="date" class="form-control" />
        </div>
        <div class="form-group">
          <label for="status">Status *</label>
          <select id="status" formControlName="status" class="form-control">
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
            <option value="SUSPENDED">SUSPENDED</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/students" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-submit" [disabled]="loading">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update Student' : 'Save Student') }}
        </button>
      </div>
    </form>
  </div>
</div>
