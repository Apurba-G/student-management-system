```html
<div class="details-container">
  <div class="back-link">
    <a routerLink="/students">← Back to Students List</a>
  </div>

  <div class="details-card" *ngIf="student">
    <div class="card-header">
      <div class="header-main">
        <h2>{{ student.firstName }} {{ student.lastName }}</h2>
        <span class="badge" [ngClass]="student.status.toLowerCase()">
          {{ student.status }}
        </span>
      </div>

      <div class="header-actions">
        <a [routerLink]="['/students', student.id, 'edit']" class="btn-edit">✏️ Edit</a>
        <button (click)="showDeleteDialog = true" class="btn-delete">🗑️ Delete</button>
      </div>
    </div>

    <div class="card-body">
      <div class="info-grid">
        <div class="info-item">
          <label>Enrollment Number</label>
          <div class="value">{{ student.enrollmentNumber }}</div>
        </div>

        <div class="info-item">
          <label>Department</label>
          <div class="value">{{ student.department }}</div>
        </div>

        <div class="info-item">
          <label>Email Address</label>
          <div class="value">{{ student.email }}</div>
        </div>

        <div class="info-item">
          <label>Phone Number</label>
          <div class="value">{{ student.phoneNumber || 'N/A' }}</div>
        </div>

        <div class="info-item">
          <label>Date of Birth</label>
          <div class="value">{{ student.dateOfBirth || 'N/A' }}</div>
        </div>

        <div class="info-item">
          <label>Registered At</label>
          <div class="value">{{ student.createdAt || 'N/A' }}</div>
        </div>
      </div>
    </div>
  </div>

  <app-student-delete-dialog
    *ngIf="showDeleteDialog"
    [studentName]="student?.firstName + ' ' + student?.lastName"
    (confirmed)="confirmDelete()"
    (cancelled)="showDeleteDialog = false"
  >
  </app-student-delete-dialog>
</div>
```
