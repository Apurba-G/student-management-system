<div class="forgot-wrapper">
  <div class="forgot-card">
    <div class="forgot-header">
      <h2>Emergency Password Reset</h2>
      <p>Reset admin password using your secure system recovery key</p>
    </div>

    <div class="alert alert-error" *ngIf="errorMsg">
      ⚠️ {{ errorMsg }}
    </div>

    <div class="alert alert-success" *ngIf="successMsg">
      ✅ {{ successMsg }}
    </div>

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
      <div class="form-group">
        <label for="username">Admin Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="form.username"
          required
          class="form-control"
          placeholder="e.g. admin"
        />
      </div>

      <div class="form-group">
        <label for="recoveryKey">Emergency Recovery Key</label>
        <input
          type="password"
          id="recoveryKey"
          name="recoveryKey"
          [(ngModel)]="form.recoveryKey"
          required
          class="form-control"
          placeholder="Enter the ADMIN_RECOVERY_KEY from server .env"
        />
        <small class="hint-text">Found in your server's <code>.env</code> file (ADMIN_RECOVERY_KEY).</small>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          [(ngModel)]="form.newPassword"
          required
          minlength="8"
          class="form-control"
          placeholder="Enter new password (min 8 chars)"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="form.confirmPassword"
          required
          class="form-control"
          placeholder="Re-type new password"
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Resetting Password...' : 'Reset Admin Password' }}
      </button>

      <div class="footer-links">
        <a routerLink="/auth/login" class="link-back">← Back to Login</a>
      </div>
    </form>
  </div>
</div>
